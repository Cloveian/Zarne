# Enable the display subsystem for the SSD1306 OLED.
# (Mirrors how the upstream nice_view shield enables it via nice_view.conf.)
CONFIG_ZMK_DISPLAY=y

# zmk-nice-oled portrait canvas for a 0.91" 128x32 SSD1306 (32 wide x 128 tall).
# The module's Kconfig defaults to 68x160 (nice!view/ePaper), so pin it here.
# NOTE: these symbols only exist when the nice_oled shield is in the build
# (i.e. "zarne_oled nice_oled"); harmless "undefined symbol" warning otherwise.
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# Use the boikisser animation on the peripheral (right) half.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_BOIKISSER=y

# Widget enable/disable
CONFIG_NICE_OLED_WIDGET_WPM=n                      # removes bongo cat
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n     # removes modifier icons

# Widget positions for 32×128 portrait SSD1306.
# Canvas-drawn (output, battery, layer): X=portrait_x (0-31), Y=portrait_y (0-127)
# LVGL objects (animation):             X=portrait_y (0-127), Y=portrait_x (0-31)

# Output icon: top of display
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=2
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=2
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=2

# Profile: dots above layer indicator; number text right of BT icon.
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=106
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_X=23
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=2
CONFIG_NICE_OLED_WIDGET_PROFILE_HIDE_ON_USB=y

# Battery: just below output
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=18

# Layer: bottom of display
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=112

# Peripheral animation: boikisser is 31(w)×32(h), centered in portrait height.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_X=48
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_Y=0
